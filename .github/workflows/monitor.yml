name: Apple Refurbished Monitor

on:
  workflow_dispatch:
    inputs:
      health_check:
        description: Send a health notification after a successful store check
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: apple-refurb-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check Apple refurbished store
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APPLE_CATEGORIES: ${{ vars.APPLE_CATEGORIES }}
          INCLUDE_KEYWORDS: ${{ vars.INCLUDE_KEYWORDS }}
          EXCLUDE_KEYWORDS: ${{ vars.EXCLUDE_KEYWORDS }}
          MAX_PRICE_TWD: ${{ vars.MAX_PRICE_TWD }}
          NOTIFY_ON_FIRST_RUN: "true"
          HEALTH_CHECK: ${{ inputs.health_check }}
        run: python apple_refurb_monitor.py

      - name: Persist latest product snapshot
        id: persist
        run: |
          if [ -z "$(git status --porcelain -- data/state.json)" ]; then
            echo "State unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git commit -m "chore: update refurbished product snapshot"
          # Someone may have pushed to main while this run was checking Apple: rebase onto it
          # instead of failing, otherwise the snapshot is lost and the same changes are sent again.
          for attempt in 1 2 3; do
            if git pull --rebase --quiet origin "$GITHUB_REF_NAME"; then
              git push && exit 0
            else
              # A conflicted rebase would make every later attempt fail too
              git rebase --abort 2>/dev/null || true
            fi
            echo "Push attempt $attempt failed, retrying"
            sleep $((attempt * 5))
          done
          exit 1

      # The notices were already sent: without the snapshot every later run would send them again
      - name: Report snapshot push failure
        if: failure() && steps.persist.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python apple_refurb_monitor.py --report-failure
          "通知已傳出，但 data/state.json 沒能 push 回 repository，之後每次執行都可能重複傳同樣的變化。請查看：$RUN_URL"
